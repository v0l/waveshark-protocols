# Vauno EN8822C-1 thermo-hygrometer, also the Fuzhou Esun T21 outdoor sensor
# and the Auriol AFT 77 A1. 433.92 MHz: PPM, 42 bits repeated, closed by a
# six bit sum of the nibbles before it.
#
# Close kin to the Esperanza EWS and the S3318P. Temperature is a signed
# twelve bit value in tenths, humidity a plain seven bit percent. Four bits
# between them have no known meaning, and the battery bit means low.
#
# Layout from rtl_433 src/devices/vauno_en8822c.c, checked against the
# rtl_433_tests vauno-en8822c-1 captures.
name: Vauno-EN8822C
timing: { ppm: [2000, 4000], reset_us: 9500, tolerance_us: 400 }
frame: { bits: 42, find: rows, copies: 2, row_bits: [42, 43], repeats: 6 }
check: { kind: nibble_sum, over: [0, 36], at: 36, width: 6 }
fields:
  - { name: id, bits: 8, data: int, id: true }
  - { bits: 1, hidden: true, default: 0 }
  - { bits: 1, hidden: true, default: 0 }
  - { name: channel, bits: 2, data: int, offset: 1, max: 3 }
  - { name: temperature_c, bits: 12, type: int, data: float, unit: c, scale: 0.1, min: -40, max: 70 }
  - { name: humidity_pct, bits: 7, data: int, unit: pct, max: 100 }
  - { name: flags, bits: 4, data: int }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { bits: 6, hidden: true }
vectors:
  - hex: "85 10 f9 74 0c 40"
    fields: { id: 133, channel: 2, temperature_c: 24.9, humidity_pct: 58, flags: 0, battery_ok: true }
  - hex: "85 20 f9 74 0c 80"
    fields: { id: 133, channel: 3, temperature_c: 24.9, humidity_pct: 58, flags: 0, battery_ok: true }
