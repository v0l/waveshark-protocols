# Fine Offset WH5, also sold as the Imagintronix soil and air sensor,
# 433.92 MHz: PWM behind seven one bits, five bytes with a CRC-8.
#
# Same five bytes as the WH2 one bit shorter, and the difference that
# matters is the temperature: unsigned, offset by forty, where the WH2 sends
# sign and magnitude. The Agimex Rosenborg 66796 sends this frame with the
# WH2's signed temperature instead, and there is nothing else to tell them
# apart, so the plausible range below is what keeps a Rosenborg from being
# read as a WH5 at 173 C.
#
# Layout from rtl_433 src/devices/fineoffset.c, checked against the
# rtl_433_tests imagintronix_wh5 captures.
name: Fineoffset-WH5
timing: { pwm: [500, 1500], reset_us: 1200, tolerance_us: 160 }
frame: { bits: 40, find: sync, sync: "fe", sync_bits: 7 }
check: { kind: crc8, poly: 0x31, init: 0x00, over: [0, 32], at: 32 }
fields:
  - { bits: 4, const: 4 }
  - { name: id, bits: 8, data: int, id: true }
  - { name: temperature_c, bits: 12, data: float, unit: c, scale: 0.1, offset: -40, min: -40, max: 60 }
  - { name: humidity_pct, bits: 8, data: int, unit: pct, max: 100 }
  - { bits: 8, hidden: true }
vectors:
  - hex: "40 32 8d 39 9f"
    fields: { id: 3, temperature_c: 25.3, humidity_pct: 57 }
  - hex: "40 32 91 37 5a"
    fields: { id: 3, temperature_c: 25.7, humidity_pct: 55 }
