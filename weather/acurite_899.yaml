# Acurite 899 rain gauge, 433.92 MHz: the same PWM frame as the 5-in-1,
# inverted, eight bytes with an additive sum and even parity on every byte
# between the id and the sum.
#
# All it sends is a running count of bucket tips at a hundredth of an inch
# each, so a receiver has to difference it for rainfall. Two bytes between
# the message type and the counter have only ever read zero.
#
# The channel comes out as the raw two bits here, 0, 1 or 2, because that is
# what rtl_433 reports for this sensor; the rest of the family maps the same
# bits to C, B and A.
#
# One vector: the corpus has one recording of this gauge and it carries a
# single frame. That recording is a 0.13 second clip whose first frame
# starts 4 ms in, and WaveShark finds only two bursts in it and slices
# neither, so this one is vector-checked rather than read off the air. The
# rest of this family, from the 5-in-1 to the Atlas, reads off the air on
# the same timing.
#
# Layout from rtl_433 src/devices/acurite.c, checked against the
# rtl_433_tests acurite/Acurite_899 capture.
name: Acurite-Rain899
timing: { pwm: [220, 408], sync_us: 620, reset_us: 4000 }
frame: { bits: 64, invert: true, repeats: 3 }
check:
  - { kind: sum8, over: [0, 56], at: 56 }
  - { kind: even_parity, over: [16, 56] }
fields:
  - { name: channel, bits: 2, data: int, max: 2 }
  - { name: id, bits: 14, data: int, id: true }
  - { bits: 1, hidden: true }
  - { name: battery_ok, bits: 1, data: bool, type: bool }
  - { bits: 6, const: 0x30 }
  - { bits: 1, hidden: true }
  - { bits: 7, hidden: true, default: 0 }
  - { bits: 1, hidden: true }
  - { bits: 7, hidden: true, default: 0 }
  - { bits: 1, hidden: true }
  - { bits: 7, hidden: true }
  - { bits: 1, hidden: true }
  - { bits: 7, hidden: true }
  - { bits: 8, hidden: true }
  - { name: rain_total_mm, gather: [[41, 48], [49, 56]], data: float, unit: mm, scale: 0.254, round: 3 }
vectors:
  - hex: "3c b0 f0 00 00 00 12 ee"
    fields: { channel: 0, id: 15536, battery_ok: true, rain_total_mm: 4.572 }
