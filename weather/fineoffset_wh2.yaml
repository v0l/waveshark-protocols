# Fine Offset WH2, also Agimex Rosenborg 66796, ClimeMET CM9088 and TFA
# Dostmann 30.3157, 433.92 MHz: PWM, a byte of ones then five bytes with a
# CRC-8. The nibble after the preamble is 4 on every unit seen, the id is
# the byte straddling the nibble boundary after it, and the temperature is
# twelve bits of sign and magnitude in tenths. A sensor with no humidity
# element sends 0xff there.
#
# Layout from rtl_433 src/devices/fineoffset.c, checked against the
# rtl_433_tests fineoffset/fineoffset_wh2 captures. The 47-bit WH5 and the
# 55-bit WH2A share this wire format with a different frame length and are
# not this description.
name: Fineoffset-WH2
timing: { pwm: [500, 1500], reset_us: 1200, tolerance_us: 160 }
frame: { bits: 48, find: rows, copies: 1, row_bits: [48, 49], repeats: 2 }
check: { kind: crc8, poly: 0x31, init: 0x00, over: [8, 40], at: 40 }
fields:
  - { bits: 8, const: 0xff }
  - { bits: 4, const: 4 }
  - { name: id, bits: 8, data: int }
  - { name: temperature_c, bits: 12, data: float, unit: c, type: sign_mag, scale: 0.1, min: -40, max: 70 }
  - { name: humidity_pct, bits: 8, data: int, unit: pct, max: 100, omit_if: 0xff }
  - { bits: 8, hidden: true }
vectors:
  - hex: "ff 4d 10 f6 21 38"
    fields: { id: 209, temperature_c: 24.6, humidity_pct: 33 }
  - hex: "ff 46 b0 f8 28 f1"
    fields: { id: 107, temperature_c: 24.8, humidity_pct: 40 }
  - hex: "ff 4c 50 c3 ff 8f"
    fields: { id: 197, temperature_c: 19.5 }
