# LaCrosse TX232TH-LCD, the temperature and humidity sensor of the WS6868
# station. 868.3 MHz: FSK at 58 us a chip behind a d2 aa 2d d4 sync, eight
# bytes with a CRC-8. Temperature and humidity are twelve bits each, packed
# three to a pair of bytes, with the same offset 500 scale 10 convention as
# the TX141.
#
# The channel dial is one based on the sensor and zero based on the air. The
# counter goes up by one every transmission, which is a nibble going up by
# two because of the spare bit under it.
#
# Both vectors come from the same sensor; it is the only one in the corpus.
#
# Layout from rtl_433 src/devices/lacrosse_ws6868.c, checked against the
# rtl_433_tests lacrosse_ws6868 capture and codes.
name: LaCrosse-TX232TH
timing: { nrz: 58, reset_us: 2000 }
frame: { bits: 64, find: sync, sync: "d2aa2dd4", sync_bits: 32 }
check: { kind: crc8, poly: 0x31, init: 0x00, over: [0, 56], at: 56 }
fields:
  - { name: id, bits: 24, data: int, id: true }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { name: test, bits: 1, data: bool, type: bool }
  - { name: channel, bits: 2, data: int, offset: 1, max: 4 }
  - { name: counter, bits: 3, data: int }
  - { bits: 1, hidden: true, default: 0 }
  - { name: temperature_c, bits: 12, data: float, unit: c, scale: 0.1, offset: -50, min: -40, max: 70 }
  - { name: humidity_pct, bits: 12, data: int, unit: pct, max: 100 }
  - { bits: 8, hidden: true }
vectors:
  - hex: "10 00 00 10 2b d0 38 ee"
    fields: { id: 1048576, battery_ok: true, test: false, channel: 2, counter: 0, temperature_c: 20.1, humidity_pct: 56 }
  - hex: "10 00 00 1a 2c 40 36 44"
    fields: { id: 1048576, battery_ok: true, test: false, channel: 2, counter: 5, temperature_c: 20.8, humidity_pct: 54 }
