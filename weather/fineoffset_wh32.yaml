# Fine Offset WH32 temperature and humidity sensor, 868.3 MHz: FSK at 58 us
# a chip behind an aa aa preamble and a 2d d4 sync, eight bytes closed by a
# sum. Same frame as the WH25 under type nibble 0xd, and this one has no
# barometer, so the pressure bytes always read ff ff.
#
# One vector: every WH32 recording in the corpus is the same sensor sending
# the same reading.
#
# Layout from rtl_433 src/devices/fineoffset.c, checked against the
# rtl_433_tests fineoffset/fineoffset_wh32 captures.
name: Fineoffset-WH32
timing: { nrz: 58, reset_us: 1500 }
frame: { bits: 64, find: sync, sync: "aa2dd4", sync_bits: 24 }
check: { kind: sum8, over: [0, 48], at: 48 }
fields:
  - { bits: 4, const: 0xd }
  - { name: id, bits: 8, data: int, id: true }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { name: reading_invalid, bits: 1, data: bool, type: bool }
  - { name: temperature_c, bits: 10, data: float, unit: c, scale: 0.1, offset: -40, min: -40, max: 60 }
  - { name: humidity_pct, bits: 8, data: int, unit: pct, max: 100 }
  - { bits: 16, const: 0xffff }
  - { bits: 8, hidden: true }
  - { bits: 8, const: 0x00 }
vectors:
  - hex: "df 82 68 36 ff ff fd 00"
    fields: { id: 248, battery_ok: true, reading_invalid: false, temperature_c: 21.6, humidity_pct: 54 }
