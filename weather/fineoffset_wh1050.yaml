# Fine Offset WH1050 weather station, sold as the TFA 30.3151 and the TFA
# Stratos 35.1077. 433.92 MHz: PWM behind seven one bits, nine bytes with a
# CRC-8. A cut down WH1080 with no wind direction vane and no radio clock.
#
# The station sends every 48 seconds, alternating one frame with two in
# quick succession, and the two are generated separately, so in heavy rain
# they can differ. Rain is a running count of bucket tips at 0.3 mm each.
# Wind and gust are counts of 0.34 m/s, reported here in km/h as the console
# shows them.
#
# The bit above the battery flag is the temperature's sign on the FSK
# version of this station. On this one it has read zero in every capture,
# and since no capture is below freezing, nothing says whether it means the
# same thing here, so it is reported raw rather than treated as a sign.
#
# The type nibble is 5 for weather. The station also sends a DCF77 clock
# under type 6, in the same nine bytes with a different layout, which is not
# this description.
#
# One station: the corpus has a single WH1050.
#
# Layout from rtl_433 src/devices/fineoffset_wh1050.c, checked against the
# rtl_433_tests fineoffset/fineoffset_wh1050 captures.
name: Fineoffset-WH1050
timing: { pwm: [544, 1524], reset_us: 10520 }
frame: { bits: 72, find: sync, sync: "fe", sync_bits: 7 }
check: { kind: crc8, poly: 0x31, init: 0x00, over: [0, 64], at: 64 }
fields:
  - { bits: 4, const: 5 }
  - { name: id, bits: 8, data: int, id: true }
  - { name: flags, bits: 1, data: int }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { name: temperature_c, bits: 10, data: float, unit: c, scale: 0.1, offset: -40, min: -40, max: 70 }
  - { name: humidity_pct, bits: 8, data: int, unit: pct, max: 100 }
  - { name: wind_avg_km_h, bits: 8, data: float, unit: km_h, scale: 1.224, round: 3 }
  - { name: wind_max_km_h, bits: 8, data: float, unit: km_h, scale: 1.224, round: 3 }
  - { name: rain_total_mm, bits: 16, data: float, unit: mm, scale: 0.3, round: 1 }
  - { bits: 8, hidden: true }
vectors:
  - hex: "53 92 59 4a 00 00 00 2d e2"
    fields: { id: 57, flags: 0, battery_ok: true, temperature_c: 20.1, humidity_pct: 74, wind_avg_km_h: 0.0, wind_max_km_h: 0.0, rain_total_mm: 13.5 }
  - hex: "53 92 38 4a 00 01 00 3d fd"
    fields: { id: 57, flags: 0, battery_ok: true, temperature_c: 16.8, humidity_pct: 74, wind_avg_km_h: 0.0, wind_max_km_h: 1.224, rain_total_mm: 18.3 }
