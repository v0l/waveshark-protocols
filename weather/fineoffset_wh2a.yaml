# Fine Offset WH2A, 433.92 MHz: PWM behind seven one bits, six bytes with a
# CRC-8 and a sum after it. The same wire format as the WH2 with one more
# byte and a shorter preamble.
#
# The nibble after the preamble is 4 on every unit seen, the id is the byte
# straddling the nibble boundary after it, and the temperature is twelve
# bits of sign and magnitude in tenths.
#
# The TFA 30.3225 sends this exact frame but has no humidity element, fills
# that byte with ff, and uses the top temperature bit as a battery flag
# instead of a sign, so it is not this description.
#
# Layout from rtl_433 src/devices/fineoffset.c, checked against the
# rtl_433_tests fineoffset/fineoffset_wh2A captures.
name: Fineoffset-WH2A
timing: { pwm: [500, 1500], reset_us: 1200, tolerance_us: 160 }
frame: { bits: 48, find: sync, sync: "fe", sync_bits: 7 }
check:
  - { kind: crc8, poly: 0x31, init: 0x00, over: [0, 32], at: 32 }
  - { kind: sum8, over: [0, 40], at: 40 }
fields:
  - { bits: 4, const: 4 }
  - { name: id, bits: 8, data: int, id: true }
  - { name: temperature_c, bits: 12, data: float, unit: c, type: sign_mag, scale: 0.1, min: -40, max: 70 }
  - { name: humidity_pct, bits: 8, data: int, unit: pct, max: 100 }
  - { bits: 8, hidden: true }
  - { bits: 8, hidden: true }
vectors:
  - hex: "40 60 de 36 a1 55"
    fields: { id: 6, temperature_c: 22.2, humidity_pct: 54 }
  - hex: "40 60 df 36 55 0a"
    fields: { id: 6, temperature_c: 22.3, humidity_pct: 54 }
