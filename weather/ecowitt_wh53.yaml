# Ecowitt WH53, WH0280 and WH0281A outdoor thermometers, 433.92 MHz: PWM,
# six bytes behind a run of ones, found on the model byte 0x53 rather than
# on the preamble, which is not always the same length. Temperature is ten
# bits in tenths from -40 C, and the byte before the CRC is always ones.
#
# Layout from rtl_433 src/devices/ecowitt.c, checked against the
# rtl_433_tests ecowitt/01 captures.
name: Ecowitt-WH53
timing: { pwm: [500, 1480], reset_us: 2000 }
frame: { bits: 48, find: sync, sync: "f530", sync_bits: 12, sync_skip: 4 }
check: { kind: crc8, poly: 0x31, init: 0x00, over: [0, 40], at: 40 }
fields:
  - { bits: 8, const: 0x53 }
  - { name: id, bits: 8, data: int }
  - { bits: 2, const: 0 }
  - { name: channel, bits: 2, data: int, offset: 1, max: 3 }
  - { bits: 2, const: 0 }
  - { name: temperature_c, bits: 10, data: float, unit: c, scale: 0.1, offset: -40, min: -40, max: 60 }
  - { bits: 8, const: 0xff }
  - { bits: 8, hidden: true }
vectors:
  - hex: "53 ff 02 56 ff b3"
    fields: { id: 255, channel: 1, temperature_c: 19.8 }
  - hex: "53 4e 12 64 ff 5e"
    fields: { id: 78, channel: 2, temperature_c: 21.2 }
