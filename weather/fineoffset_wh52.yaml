# Fine Offset WH52 soil probe, also sold as the Ecowitt WH52: moisture,
# soil temperature and electrical conductivity. FSK at 58 us a chip behind
# an aa aa preamble and a 2d d4 sync, twenty four bytes closed by a CRC-8
# and a sum over everything including that CRC. It sends about every 70
# seconds.
#
# Conductivity is a twenty bit count whose top nibble shares a byte with an
# uncharacterised moisture raw value, divided by 25.6 to reach microsiemens
# per centimetre, which is an empirical fit rather than a stated scale. The
# eight bytes before the battery are per-unit factory data, constant for one
# probe and different on the next, so they are reported as they arrive.
#
# The corpus json for these captures was written by an earlier version of
# the decoder whose battery scale was one step lower, so it prints 1.560 V
# where this reads 1580 mV.
#
# Layout from rtl_433 src/devices/fineoffset_wh52.c, checked against the
# rtl_433_tests fineoffset/fineoffset_wh52 captures.
name: Fineoffset-WH52
timing: { nrz: 58, reset_us: 5000 }
frame: { bits: 192, find: sync, sync: "aa2dd4", sync_bits: 24 }
check:
  - { kind: crc8, poly: 0x31, init: 0x00, over: [0, 176], at: 176 }
  - { kind: sum8, over: [0, 184], at: 184 }
fields:
  - { bits: 8, const: 0xa2 }
  - { name: id, bits: 24, data: text, type: hex, id: true }
  - { name: boost, bits: 3, data: int }
  - { name: temperature_c, bits: 13, data: float, unit: c, scale: 0.1, offset: -40, min: -40, max: 70 }
  - { name: moisture_pct, bits: 8, data: int, unit: pct, max: 100 }
  - { name: moisture_raw, bits: 8, data: int }
  - { name: moisture_raw_high, bits: 4, data: int }
  - { name: conductivity_us_cm, bits: 20, data: float, scale: 0.0390625, round: 3 }
  - { name: ec_range, bits: 4, data: int }
  - { bits: 4, const: 0x6 }
  - { name: unit_data, bits: 64, data: text, type: hex }
  - { name: battery_mv, bits: 8, data: int, unit: mv, scale: 20 }
  - { bits: 8, hidden: true, default: 0x08 }
  - { bits: 8, hidden: true }
  - { bits: 8, hidden: true }
vectors:
  - hex: "a2 00 58 ac 02 5c 2c 28 40 0a ad 16 59 3e 93 51 7e 63 7b 45 4f 08 11 e9"
    fields: { id: "0058ac", boost: 0, temperature_c: 20.4, moisture_pct: 44, moisture_raw: 40, moisture_raw_high: 4, conductivity_us_cm: 106.758, ec_range: 1, unit_data: "593e93517e637b45", battery_mv: 1580 }
  - hex: "a2 00 5c b5 02 5f 19 75 30 05 9e 16 56 53 93 52 7e 6f 7b 6a 4f 08 bd ff"
    fields: { id: "005cb5", boost: 0, temperature_c: 20.7, moisture_pct: 25, moisture_raw: 117, moisture_raw_high: 3, conductivity_us_cm: 56.172, ec_range: 1, unit_data: "565393527e6f7b6a", battery_mv: 1580 }
