# Revolt NC-5462 plug-in energy meter, 433.92 MHz: PWM after a 10 ms sync
# pulse, inverted, thirteen bytes with a sum of the first eleven in the
# twelfth. Sent five times in a burst.
#
# Voltage is whole volts, current hundredths of an amp, power tenths of a
# watt, the power factor hundredths, and the energy total hundredths of a
# kilowatt hour. The button bit is set while the meter's own button is held,
# which puts it into the register mode that repeats the same frame. The last
# byte is not covered by the sum and nothing is known about it.
#
# One meter: it is the only NC-5462 in the corpus.
#
# Layout from rtl_433 src/devices/revolt_nc5462.c, checked against the
# rtl_433_tests revolt_nc_5462 captures and codes.
name: Revolt-NC5462
timing: { pwm: [200, 320], sync_us: 10024, reset_us: 272 }
frame: { bits: 104, invert: true, find: rows, copies: 2, row_bits: [104, 105], repeats: 5 }
check: { kind: sum8, over: [0, 88], at: 88 }
fields:
  - { name: button, bits: 1, data: bool, type: bool }
  - { name: id, bits: 15, data: int, id: true }
  - { name: voltage_v, bits: 8, data: int, unit: v, max: 260 }
  - { name: current_a, bits: 16, data: float, unit: a, scale: 0.01 }
  - { name: frequency_hz, bits: 8, data: int, unit: hz, max: 70 }
  - { name: power_w, bits: 16, data: float, unit: w, scale: 0.1 }
  - { name: power_factor, bits: 8, data: float, scale: 0.01 }
  - { name: energy_kwh, bits: 16, data: float, unit: kwh, scale: 0.01 }
  - { bits: 8, hidden: true }
  - { name: unknown, bits: 8, data: int }
vectors:
  - hex: "82 21 e9 00 1f 32 02 8e 5a 77 f9 37 cb"
    fields: { button: true, id: 545, voltage_v: 233, current_a: 0.31, frequency_hz: 50, power_w: 65.4, power_factor: 0.9, energy_kwh: 307.13, unknown: 203 }
  - hex: "02 21 e9 00 00 32 00 04 64 77 f8 15 0a"
    fields: { button: false, id: 545, voltage_v: 233, current_a: 0.0, frequency_hz: 50, power_w: 0.4, power_factor: 1.0, energy_kwh: 307.12, unknown: 10 }
