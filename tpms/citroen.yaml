# Citroen, Peugeot and other VDO-type tyre pressure sensors, 433.92 MHz:
# FSK at 52 us a chip, Manchester behind an aaa9 preamble, ten bytes closed
# by an exclusive-or that covers everything but the first byte. That first
# byte is a state of some kind and nobody has worked out what it means, so
# it is reported raw. Pressure is in steps of 1.364 kPa, about a fifth of a
# PSI; temperature is offset by 50 C.
#
# Layout from rtl_433 src/devices/tpms_citroen.c, checked against the
# rtl_433_tests Citroen_TPMS capture.
name: Citroen
timing: { nrz: 52, reset_us: 150 }
frame: { bits: 80, find: sync, sync: "aaa9", sync_bits: 16, decode: manchester, either_polarity: true }
check: { kind: xor8, over: [8, 72], at: 72 }
fields:
  - { name: state, bits: 8, data: text, type: hex }
  - { name: id, bits: 32, data: text, type: hex }
  - { name: flags, bits: 4, data: int }
  - { name: sequence_num, bits: 4, data: int }
  - { name: pressure_kpa, bits: 8, data: float, unit: kpa, scale: 1.364, round: 0, min: 0, max: 350 }
  - { name: temperature_c, bits: 8, data: float, unit: c, offset: -50, round: 0, min: -50, max: 100 }
  - { name: battery_raw, bits: 8, data: int }
  - { bits: 8, hidden: true }
vectors:
  - hex: "d2 8a dd 48 d4 01 d4 49 0e 59"
    fields: { state: "d2", id: "8add48d4", flags: 0, sequence_num: 1, pressure_kpa: 289.0, temperature_c: 23.0, battery_raw: 14 }
  - hex: "d2 8a dd 48 d4 03 d4 49 0e 5b"
    fields: { state: "d2", id: "8add48d4", flags: 0, sequence_num: 3, pressure_kpa: 289.0, temperature_c: 23.0, battery_raw: 14 }
